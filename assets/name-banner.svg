<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 130" width="860" height="130">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050918"/>
      <stop offset="100%" stop-color="#1a0640"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff9de2"/>
      <stop offset="30%"  stop-color="#FF69B4"/>
      <stop offset="60%"  stop-color="#ff1ca8"/>
      <stop offset="100%" stop-color="#ff9de2"/>
      <animate attributeName="x1" values="0;0.3;0;-0.3;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.3;1;0.7;1"  dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7b2ff7" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#FF69B4" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#00d4ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
    </linearGradient>
    <filter id="nameGlow" x="-15%" y="-80%" width="130%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subGlow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="130" fill="url(#bg)" rx="14"/>

  <!-- Stars -->
  <circle cx="30"  cy="20"  r="1.5" fill="white"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="80"  cy="50"  r="1"   fill="white"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.1s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="25"  r="1.3" fill="white"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.7s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="18"  r="1.5" fill="white"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="780" cy="40"  r="1"   fill="white"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" begin="0.1s" repeatCount="indefinite"/></circle>
  <circle cx="820" cy="22"  r="1.5" fill="#fdf"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
  <circle cx="840" cy="80"  r="1"   fill="white"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.2s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="40"  cy="95"  r="1.2" fill="white"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" begin="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="810" cy="100" r="1.3" fill="#adf"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="430" cy="15"  r="1"   fill="white"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" begin="0.9s" repeatCount="indefinite"/></circle>

  <!-- Decorative top line -->
  <rect x="100" y="12" width="660" height="1.5" fill="url(#lineGrad)" rx="1">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner accents -->
  <path d="M 16 16 L 42 16 M 16 16 L 16 42" stroke="#7b2ff7" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 844 16 L 818 16 M 844 16 L 844 42" stroke="#7b2ff7" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 16 114 L 42 114 M 16 114 L 16 88" stroke="#7b2ff7" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 844 114 L 818 114 M 844 114 L 844 88" stroke="#7b2ff7" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Floating sparkles near name -->
  <text x="148" y="73" font-size="16" fill="#FF69B4" filter="url(#subGlow)">
    ✦
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="696" y="73" font-size="16" fill="#FF69B4" filter="url(#subGlow)">
    ✦
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="2s" begin="1s" repeatCount="indefinite"/>
  </text>
  <text x="120" y="95" font-size="10" fill="#bd93f9">
    ✦
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </text>
  <text x="724" y="95" font-size="10" fill="#bd93f9">
    ✦
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </text>

  <!-- Glow shadow layer for name -->
  <text x="430" y="76"
        text-anchor="middle"
        font-family="Georgia, 'Palatino Linotype', serif"
        font-size="50"
        font-weight="bold"
        letter-spacing="8"
        fill="#FF69B4"
        filter="url(#nameGlow)"
        opacity="0.5">Rabia Sohail</text>

  <!-- Main animated name -->
  <text x="430" y="76"
        text-anchor="middle"
        font-family="Georgia, 'Palatino Linotype', serif"
        font-size="50"
        font-weight="bold"
        letter-spacing="8"
        fill="url(#nameGrad)">
    Rabia Sohail
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="430" y="105"
        text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="13"
        letter-spacing="5"
        fill="#bd93f9"
        filter="url(#subGlow)">
    ✦  AI Developer  ·  Pakistan  ·  Hackathon Champion  ✦
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Bottom decorative line -->
  <rect x="100" y="117" width="660" height="1.5" fill="url(#lineGrad)" rx="1">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" begin="2s" repeatCount="indefinite"/>
  </rect>

</svg>
